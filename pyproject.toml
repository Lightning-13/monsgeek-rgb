[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monsgeek-rgb"
version = "0.1.0"
description = "Python library for controlling RGB lighting on MonsGeek/Yichip keyboards"
readme = "README.md"
requires-python = ">=3.9"

authors = [
    { name = "Lightning-13" }
]

keywords = [
    "monsgeek",
    "yichip",
    "rgb",
    "keyboard",
    "hid",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
]

dependencies = [
    "hidapi",
]

[tool.setuptools.packages.find]
where = ["."]